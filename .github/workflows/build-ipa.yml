name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app

      - name: Build iOS App (.app)
        run: |
          xcodebuild clean build \
            -project "MB Bank.xcodeproj" \
            -scheme "MB Bank" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            BUILD_DIR="build"

      - name: Package into .ipa
        run: |
          mkdir -p Payload
          cp "MB Bank"/Icon*.jpg "build/Release-iphoneos/MB Bank.app/" 2>/dev/null || true
          cp -r "build/Release-iphoneos/MB Bank.app" Payload/
          zip -r "MB_Bank.ipa" Payload
          ls -lh MB_Bank.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MB_Bank_iOS_App
          path: MB_Bank.ipa
          retention-days: 14
